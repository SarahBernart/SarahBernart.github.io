<!doctype html>
<html lang="de">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Dr. Sarah Bernart</title>

  <meta name="description" content="Computational catalysis • ML potentials • Microkinetics • Python/ASE/VASP" />

  <style>
    body{
      font-family: -apple-system, system-ui, Segoe UI, Roboto, sans-serif;
      margin: 0;
      padding: 0;
      line-height: 1.5;
      background: #000;
      color: #fff;
    }

    /* HEADER oben */
    .container{
      max-width: 860px;
      margin: 0 auto;
      padding: 48px 24px 18px;
    }

    h1{ margin: 0 0 10px; font-size: 34px; }

    .links{ margin: 0; font-size: 18px; }
    .links a{ color:#fff; margin-right:14px; text-decoration:none; }
    .links a:hover{ text-decoration: underline; }

    /* HERO: wichtig -> position:relative, damit Overlay NICHT oben am Body klebt */
    .hero{
      position: relative;
      width: 100%;
      height: 70vh;
      overflow: hidden;
    }

    .hero-video{
      width: 100%;
      height: 100%;
      display: block;
      object-fit: cover;
    }

    /* Tabs + Dropdown über dem Video */
    .hero-ui{
      position: absolute;
      left: 50%;
      top: 16px;
      transform: translateX(-50%);
      width: min(860px, calc(100% - 48px));
      z-index: 10;
    }

    .tabs{
      display: flex;
      flex-wrap: wrap;   /* <- Tippfehler gefixt */
      gap: 10px;
      align-items: center;
    }

    .tab-btn{            /* <- Selektor gefixt */
      appearance: none;
      border: 1px solid rgba(255,255,255,0.65);
      background: rgba(0,0,0,0.25);
      color: rgba(255,255,255,0.95);
      padding: 8px 12px;
      border-radius: 999px;
      cursor: pointer;
      font-size: 14px;
      transition: background 160ms ease, color 160ms ease, border-color 160ms ease;
      backdrop-filter: blur(8px);
      -webkit-backdrop-filter: blur(8px);
    }

    .tab-btn[aria-expanded="true"]{
      background: rgba(255,255,255,0.5);
      border-color: rgba(255,255,255,0.5);
      color: #000;
    }

    .panel{
      margin-top: 12px;
      border-radius: 16px;
      background: rgba(255,255,255,0.65);
      color: #000;
      padding: 14px 16px;
      border: 1px solid rgba(255,255,255,0.35);
      backdrop-filter: blur(10px);
      -webkit-backdrop-filter: blur(10px);

      opacity: 0;
      transform: translateY(-8px);
      pointer-events: none;
      transition: opacity 160ms ease, transform 160ms ease; /* <- Tippfehler gefixt */
    } /* <- fehlende Klammer war der große Bug */

    .panel.open{
      opacity: 1;
      transform: translateY(0);
      pointer-events: auto;
    }

    .panel h3{ margin: 0 0 8px; font-size: 16px; }
    .subitems{ margin: 0; padding-left: 18px; }
    .subitems li{ margin: 6px 0; }
    .panel a{ color:#000; text-decoration: underline; }
  </style>
</head>

<body>
  <header class="container">
    <h1>Sarah Bernart</h1>
    <p class="links">
      <a href="https://github.com/SarahBernart">GitHub</a>
      <a href="https://scholar.google.de/citations?hl=de&pli=1&user=UMwwItMAAAAJ">Google Scholar</a>
      <a href="https://orcid.org/0000-0001-5722-7634">ORCID</a>
      <a href="https://www.linkedin.com/in/sarah-bernart-554667136/">LinkedIn</a>
    </p>
  </header>

  <section class="hero">
    <video class="hero-video" autoplay muted loop playsinline preload="auto">
      <source src="water2.mp4" type="video/mp4">
    </video>

    <div class="hero-ui">
      <nav class="tabs" aria-label="Sektionen">
        <button class="tab-btn" data-tab="catalysis" aria-expanded="false">Computational catalysis</button>
        <button class="tab-btn" data-tab="ml" aria-expanded="false">ML potentials</button>
        <button class="tab-btn" data-tab="mkm" aria-expanded="false">Microkinetics</button>
        <button class="tab-btn" data-tab="tools" aria-expanded="false">Python/ASE/VASP</button>
      </nav>

      <div class="panel" id="panel" role="region" aria-live="polite"></div>
    </div>
  </section>

  <script>
    const TAB_CONTENT = {
      catalysis: { title: "Computational catalysis", items: [
        { label: "a) …", href: "#" },
        { label: "b) …", href: "#" },
        { label: "c) …", href: "#" },
      ]},
      ml: { title: "ML potentials", items: [
        { label: "a) …", href: "#" },
        { label: "b) …", href: "#" },
        { label: "c) …", href: "#" },
      ]},
      mkm: { title: "Microkinetics", items: [
        { label: "a) …", href: "#" },
        { label: "b) …", href: "#" },
        { label: "c) …", href: "#" },
      ]},
      tools: { title: "Python/ASE/VASP", items: [
        { label: "a) …", href: "#" },
        { label: "b) …", href: "#" },
        { label: "c) …", href: "#" },
      ]},
    };

    const buttons = [...document.querySelectorAll(".tab-btn")];
    const panel = document.getElementById("panel");

    function closeAll(){
      buttons.forEach(b => b.setAttribute("aria-expanded", "false"));
      panel.classList.remove("open");
      panel.innerHTML = "";
      panel.dataset.active = "";
    }

    function openTab(key, btn){
      const data = TAB_CONTENT[key];
      if(!data) return;

      if(panel.dataset.active === key && panel.classList.contains("open")){
        closeAll(); return;
      }

      buttons.forEach(b => b.setAttribute("aria-expanded", String(b === btn)));
      panel.dataset.active = key;

      panel.innerHTML = `
        <h3>${data.title}</h3>
        <ul class="subitems">
          ${data.items.map(i => `<li><a href="${i.href}">${i.label}</a></li>`).join("")}
        </ul>
      `;
      panel.classList.add("open");
    }

    buttons.forEach(btn => btn.addEventListener("click", () => openTab(btn.dataset.tab, btn)));

    document.addEventListener("click", (e) => {
      const ui = document.querySelector(".hero-ui");
      if(!ui.contains(e.target)) closeAll();
    });

    document.addEventListener("keydown", (e) => {
      if(e.key === "Escape") closeAll();
    });
  </script>
</body>
</html>
